name: Check December one-way fares
on:
  workflow_dispatch:
    inputs:
      source:
        description: Sources to attempt (experimental adapters)
        type: choice
        options: [all, google, kayak, trip]
        default: all
      first:
        description: First December departure (YYYY-MM-DD)
        default: '2026-12-01'
        required: true
      last:
        description: Last December departure (use the same date for a smoke test)
        default: '2026-12-31'
        required: true
permissions:
  contents: read
concurrency:
  group: manual-flight-check
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline checks
        run: python scanner.py --self-test
      - name: Install browser on GitHub runner only
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Attempt source searches and write browser-readable report
        env:
          FIRST: ${{ inputs.first }}
          LAST: ${{ inputs.last }}
          SOURCE: ${{ inputs.source }}
        run: python scanner.py --first "$FIRST" --last "$LAST" --source "$SOURCE"
